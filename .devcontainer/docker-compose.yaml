version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ../../:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    # network_mode: service:pgadmin
    # Uncomment to connect as root instead. More info: https://aka.ms/dev-containers-non-root.
    # user: root

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

    depends_on:
      - jellydb
    networks:
      - jellynetwork
  jellydb:
    image: postgres:17.2@sha256:3267c505060a0052e5aa6e5175a7b41ab6b04da2f8c4540fc6e98a37210aa2d3
    restart: unless-stopped
    hostname: jellydb
    volumes:
      - postgres-new-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: jellyfin
      POSTGRES_USER: jellyfin
      POSTGRES_DB: Jellyfin
    networks:
      - jellynetwork
  pgadmin:
    image: dpage/pgadmin4@sha256:2f4ce946ddf8360680d7eff4eaba1d91859eb6b4003e6623bad5c63a322c2f4d
    restart: unless-stopped
    depends_on:
      - jellydb
    networks:
      - jellynetwork
    volumes:
      - ./pgsql/pgadmin:/pgadmin
      - pgadmin-data:/var/lib/pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=user@domain.com
      - PGADMIN_DEFAULT_PASSWORD=SuperSecret
      - PGADMIN_LISTEN_PORT=8081
      - PGADMIN_SERVER_JSON_FILE=/pgadmin/servers.json
      - PGADMIN_CONFIG_SERVER_MODE=False
    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)


volumes:
  postgres-new-data:
  pgadmin-data:

networks:
  jellynetwork:
    name: "jellynetwork"
    driver: bridge
