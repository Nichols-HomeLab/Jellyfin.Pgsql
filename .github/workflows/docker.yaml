name: Build and publish PostgreSQL adapter
on:
  push:
    branches: [main]
  release:
    types: [released]
  workflow_dispatch:

concurrency:
  group: pgsql-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: [self-hosted, k3s, linux, amd64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout pinned server and provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Connect to nested Docker daemon
        run: |
          gateway_hex="$(awk '$2 == "00000000" { print $3; exit }' /proc/net/route)"
          test "${#gateway_hex}" -eq 8
          printf -v docker_gateway '%d.%d.%d.%d' \
            "0x${gateway_hex:6:2}" "0x${gateway_hex:4:2}" \
            "0x${gateway_hex:2:2}" "0x${gateway_hex:0:2}"
          docker_host="tcp://${docker_gateway}:2375"
          DOCKER_HOST="$docker_host" docker version >/dev/null
          echo "DOCKER_HOST=$docker_host" >> "$GITHUB_ENV"

      - name: Log in to Gitea container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: git.nicholstech.org
          username: admin
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            git.nicholstech.org/nichols-homelab/jellyfin.pgsql:12.0-nichols.${{ github.run_number }}
            git.nicholstech.org/nichols-homelab/jellyfin.pgsql:sha-${{ github.sha }}
            git.nicholstech.org/nichols-homelab/jellyfin.pgsql:latest
