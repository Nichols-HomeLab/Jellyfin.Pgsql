name: '🐋 Build & Publish Docker Image'

on:
  release:
    types:
      - released
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine image version
        id: version
        run: |
          # Extract the Jellyfin base version from the Dockerfile (handles optional AS alias)
          JELLYFIN_VERSION=$(grep -oP '(?<=FROM jellyfin/jellyfin:)[^\s]+' docker/Dockerfile | head -1)
          echo "jellyfin_version=$JELLYFIN_VERSION" >> "$GITHUB_OUTPUT"

          IMAGE_OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${JELLYFIN_VERSION}-nichols.${GITHUB_RUN_NUMBER}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Computed image tag: $IMAGE_TAG"

          TAGS="ghcr.io/${IMAGE_OWNER}/jellyfin.pgsql:${IMAGE_TAG}"$'\n'"ghcr.io/${IMAGE_OWNER}/jellyfin.pgsql:latest"
          # Use a multiline-safe delimiter for the output
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
